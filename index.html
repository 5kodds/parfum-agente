<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Scent Deduction — AI Perfume Matchmaker</title>
<meta name="description" content="Six instinct questions. A deduced scent profile. Real perfume recommendations matched to you." />
<style>
  :root{
    --bg:#1D1610; --panel:#282017; --panel-soft:#332A1E;
    --gold:#D9A441; --gold-soft:#B98A3A;
    --cream:#F2E8D8; --cream-dim:#C9BBA4;
    --oxblood:#8A3B34; --line:#4A3D2B;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--cream);font-family:var(--sans);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:48px 20px 64px}
  .full{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,8vw,44px);line-height:1.1;margin-bottom:18px}
  h1 em{color:var(--gold)}
  h2{font-family:var(--serif);font-weight:500;font-size:clamp(24px,6vw,30px);margin-bottom:8px}
  p.lead{color:var(--cream-dim);font-size:16px;line-height:1.6;margin-bottom:32px;max-width:460px}
  .btn{background:var(--gold);color:var(--bg);border:none;border-radius:10px;padding:14px 26px;font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.04em;cursor:pointer}
  .btn:focus-visible,.ghost:focus-visible,.card:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn:hover{background:var(--gold-soft)}
  .ghost{background:transparent;color:var(--cream-dim);border:1px solid var(--line);border-radius:10px;padding:13px 22px;font-size:14px;cursor:pointer}
  .ghost:hover{border-color:var(--gold);color:var(--cream)}
  .card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:var(--cream);font-family:var(--serif);font-size:17px;cursor:pointer;margin-bottom:10px;transition:border-color .15s,background .15s}
  .card:hover{border-color:var(--gold);background:var(--panel-soft)}
  input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 16px;color:var(--cream);font-family:var(--serif);font-size:17px;margin-bottom:20px;outline:none}
  input[type=text]::placeholder{color:#8a7c63}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .progress{display:flex;gap:6px;margin-bottom:34px}
  .progress span{flex:1;height:2px;border-radius:2px;background:var(--line)}
  .progress span.on{background:var(--gold)}
  .help{color:var(--cream-dim);font-size:14px;margin-bottom:22px}
  /* loading */
  .spinner{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:spin .9s linear infinite;margin:0 auto 26px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .center{text-align:center}
  /* results */
  .headline{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(30px,7vw,38px);color:var(--gold);line-height:1.15;margin-bottom:14px}
  .summary{font-size:16px;line-height:1.65;margin-bottom:30px}
  .fam{margin-bottom:12px}
  .fam .lbl{display:flex;justify-content:space-between;margin-bottom:5px}
  .fam .lbl b{font-family:var(--serif);font-weight:400;font-size:15px}
  .fam .lbl span{color:var(--cream-dim);font-size:13px}
  .bar{height:4px;background:var(--line);border-radius:4px}
  .bar i{display:block;height:4px;background:var(--gold);border-radius:4px}
  .pyr{display:flex;justify-content:center;margin-bottom:8px}
  .pyr>div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:center}
  .pyr .t{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
  .pyr .n{font-family:var(--serif);font-size:15px}
  .rec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;margin-bottom:14px}
  .rec.top{border-color:var(--gold)}
  .rec .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .rec .name{font-family:var(--serif);font-size:20px}
  .rec .price{color:var(--gold);font-size:13px;letter-spacing:2px;white-space:nowrap}
  .rec .brand{color:var(--cream-dim);font-size:13px;margin:2px 0 8px}
  .rec .brand b{color:var(--gold);font-weight:400}
  .rec .notes{font-family:var(--serif);font-style:italic;font-size:14px;margin-bottom:8px}
  .rec .why{font-size:14px;line-height:1.55;color:var(--cream-dim)}
  .wild{background:linear-gradient(135deg,rgba(138,59,52,.13),var(--panel));border:1px solid var(--oxblood);border-radius:12px;padding:18px 18px 16px;margin-bottom:30px}
  .wild .t{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#D08A80;margin-bottom:8px}
  .sect{margin:36px 0 14px}
  .foot{margin-top:44px;color:#8a7c63;font-size:12px;line-height:1.6}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .chip{background:transparent;border:1px solid var(--line);color:var(--cream-dim);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--gold-soft)}
  .chip.on{border-color:var(--gold);color:var(--gold)}
  .tv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000}
  .tv iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
  .tv.shorts iframe{aspect-ratio:9/16;max-height:70vh;margin:0 auto;max-width:400px}
  .sotd{background:linear-gradient(135deg,rgba(217,164,65,.10),var(--panel));border:1px solid var(--gold-soft);border-radius:12px;padding:18px}
  .hist{width:100%;text-align:left;font-family:var(--sans);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;color:var(--cream)}
  .hist:hover{border-color:var(--gold)}
  .hist .h1{font-family:var(--serif);font-size:16px}
  .hist .h2{color:var(--cream-dim);font-size:12px;margin-top:2px}
  .hist .d{color:#8a7c63;font-size:12px;white-space:nowrap}
  .linkline{color:var(--gold);font-size:13px;text-decoration:none}
  .linkline:hover{text-decoration:underline}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

/* ============================================================

   ============================================================ */

/* tier: 1 = under $50, 2 = $50–150, 3 = $150+  */

 {name:"Vibrant Leather", brand:"Zara", tier:1, price:"$",

 {name:"Amber Oud Gold Edition", brand:"Al Haramain", tier:1, price:"$",

 {name:"Black Opium EDP", brand:"Yves Saint Laurent", tier:2, price:"$$",

 {name:"Vanilla | 28", brand:"Kayali", tier:2, price:"$$",

  hook:"literal cozy woodsmoke and roasted chestnut"},
 {name:"Santal 33", brand:"Le Labo", tier:3, price:"$$$",
  notes:"Sandalwood, cardamom, leather, iris",
  scenes:{library:3,bonfire:1}, sweet:0, proj:2, clim:{hot:1,temp:2,cold:2}, occ:{all:3,daily:2,evening:2},
  hook:"the modern woody-leather signature scent"},
 {name:"Tobacco Vanille", brand:"Tom Ford", tier:3, price:"$$$",
  notes:"Tobacco leaf, vanilla, cocoa, tonka",
  scenes:{bonfire:2,bakery:2}, sweet:2, proj:2, clim:{hot:0,temp:1,cold:2}, occ:{evening:2,special:3},
  hook:"opulent sweet tobacco — a cold-weather event"},
 {name:"Oud Wood", brand:"Tom Ford", tier:3, price:"$$$",
  notes:"Oud, rosewood, cardamom, amber",
  scenes:{library:3}, sweet:0, proj:1, clim:{hot:1,temp:2,cold:2}, occ:{evening:2,special:2,all:2},
  hook:"smooth, approachable oud with quiet confidence"},
 {name:"Baccarat Rouge 540", brand:"Maison Francis Kurkdjian", tier:3, price:"$$$",
  notes:"Saffron, jasmine, amberwood, ambergris",
  scenes:{bonfire:2,bakery:1,nightgarden:1}, sweet:2, proj:2, clim:{hot:1,temp:2,cold:2}, occ:{evening:2,special:3,all:2},
  hook:"the glowing amber phenomenon with a mile-long trail"},
 {name:"Coco Mademoiselle", brand:"Chanel", tier:3, price:"$$$",
  notes:"Orange, rose, jasmine, patchouli",
  scenes:{citrus:2,nightgarden:2}, sweet:1, proj:1, clim:{hot:1,temp:2,cold:1}, occ:{all:3,daily:2,evening:2,special:2},
  hook:"the polished do-everything classic"},
 {name:"Colonia", brand:"Acqua di Parma", tier:3, price:"$$$",
  notes:"Sicilian citrus, lavender, rosemary, woods",
  scenes:{citrus:3}, sweet:0, proj:0, clim:{hot:2,temp:2,cold:0}, occ:{daily:3,all:2},
  hook:"a century-old Italian citrus with impeccable manners"},
 {name:"Silver Mountain Water", brand:"Creed", tier:3, price:"$$$",
  notes:"Bergamot, green tea, blackcurrant, musk",

  hook:"alpine stream freshness with a luxe metallic edge"},
 {name:"Gypsy Water", brand:"Byredo", tier:3, price:"$$$",
  notes:"Bergamot, pine needles, vanilla, sandalwood",
  scenes:{library:2,rain:1,bonfire:1}, sweet:1, proj:0, clim:{hot:1,temp:2,cold:2}, occ:{daily:2,all:2},
  hook:"forest-floor woods softened by faint vanilla"},
];

/* Anchor DNA map: keyword → scene boost + optional sweetness hint */
const ANCHORS = [
 {kw:["cheirosa","sol de janeiro","62"], scene:"bakery", sweet:2},
 {kw:["cloud","ariana"], scene:"bakery", sweet:2},
 {kw:["vanilla","tonka","caramel","gourmand"], scene:"bakery", sweet:2},
 {kw:["black opium"], scene:"bakery", sweet:2},
 {kw:["la vie est belle"], scene:"bakery", sweet:2},
 {kw:["baccarat","rouge 540","br540"], scene:"bonfire", sweet:2},
 {kw:["tobacco","by the fireplace","incense","oud"], scene:"bonfire", sweet:1},
 {kw:["santal","sandalwood","leather","woody"], scene:"library", sweet:0},
 {kw:["aventus"], scene:"library", sweet:1},
 {kw:["sauvage","bleu de chanel","dylan blue"], scene:"rain", sweet:0},
 {kw:["light blue","lemon","citrus","neroli","colonia"], scene:"citrus", sweet:0},
 {kw:["jasmine","bloom","good girl","tuberose","libre","gardenia","flowerbomb"], scene:"nightgarden", sweet:1},
 {kw:["musk","clean","fresh","aqua","ocean","sea"], scene:"rain", sweet:0},
];

/* Scene → deduced profile scaffolding */
const PROFILES = {
 bakery:{ headline:"The Warm Gourmand",
  families:[["Gourmand",45],["Amber",25],["Floral",18],["Musk",12]],
  pyramid:{top:["Bergamot","Almond","Pink pepper"],heart:["Praline","Jasmine","Heliotrope"],base:["Vanilla","Tonka bean","Sandalwood"]},
  line:"You're drawn to comfort made luxurious — scents that feel like warmth, sweetness and skin." },
 rain:{ headline:"The Clean Minimalist",
  families:[["Fresh Aquatic",40],["Musk",30],["Green",18],["Woody",12]],
  pyramid:{top:["Sea notes","Bergamot","Mint"],heart:["Mineral accord","Sage","Lily of the valley"],base:["White musk","Driftwood","Ambergris"]},
  line:"You want air, water and clean skin — presence through freshness, never through weight." },
 citrus:{ headline:"The Radiant Fresh",
  families:[["Citrus",45],["Green",22],["Floral",18],["Woody",15]],
  pyramid:{top:["Sicilian lemon","Neroli","Grapefruit"],heart:["Orange blossom","Petitgrain","Green tea"],base:["Vetiver","Cedar","Light musk"]},
  line:"You gravitate to sunlight in scent form — sparkling, optimistic and effortlessly polished." },
 library:{ headline:"The Quiet Sophisticate",
  families:[["Woody",42],["Leather",25],["Amber",20],["Spice",13]],
  pyramid:{top:["Bergamot","Cardamom","Saffron"],heart:["Leather","Iris","Cedar"],base:["Amber","Oud","Patchouli"]},
  line:"You prefer depth over sparkle — scents with texture, intelligence and a long memory." },
 nightgarden:{ headline:"The Night Bloom",
  families:[["White Floral",45],["Musk",20],["Fruity",18],["Amber",17]],
  pyramid:{top:["Pear","Mandarin","Green leaves"],heart:["Jasmine sambac","Tuberose","Orange blossom"],base:["White musk","Sandalwood","Soft vanilla"]},
  line:"You're pulled toward lush, romantic florals — heady, alive and unapologetically feminine in spirit." },
 bonfire:{ headline:"The Smoky Romantic",
  families:[["Amber",38],["Smoky",27],["Gourmand",20],["Woody",15]],
  pyramid:{top:["Pink pepper","Orange","Clove"],heart:["Incense","Chestnut","Guaiac wood"],base:["Vanilla","Smoked woods","Labdanum"]},
  line:"You love contrast — warmth against smoke, sweetness against fire. Scents with a story." },
};

const CLIMATE_TXT = {hot:"hot, humid air", temp:"mild weather", cold:"cold seasons"};
const OCC_TXT = {daily:"everyday wear", evening:"evenings out", special:"special occasions", all:"an all-purpose signature"};
const PROJ_TXT = ["staying intimate and close to skin","leaving a soft trail","filling the room"];

/* ---------- scoring ---------- */
function anchorBoost(anchor){
  const a = anchor.toLowerCase();
  for (const e of ANCHORS){
    if (e.kw.some(k => a.includes(k))) return e;
  }
  return null;
}

function score(f, ans, boost){
  let s = 0;
  s += 3 * (f.scenes[ans.scene] || 0);
  s += 2 * (f.clim[ans.climate] || 0);
  s += 2 * (2 - Math.abs(f.sweet - ans.sweet));
  s += 1.5 * (2 - Math.abs(f.proj - ans.proj));
  s += 2 * (f.occ[ans.occ] || 0);
  if (boost) s += 1.5 * (f.scenes[boost.scene] || 0);
  return s;
}

function whyText(f, ans, isAnchorMatch){
  const bits = [];
  if ((f.scenes[ans.scene]||0) >= 2) bits.push("sits squarely in the territory your scene choice pointed to");
  if ((f.clim[ans.climate]||0) >= 2) bits.push("performs beautifully in " + CLIMATE_TXT[ans.climate]);
  if (Math.abs(f.sweet - ans.sweet) === 0) bits.push("matches your sweetness level exactly");
  if (Math.abs(f.proj - ans.proj) === 0) bits.push("projects just how you asked — " + PROJ_TXT[ans.proj]);
  if ((f.occ[ans.occ]||0) >= 2) bits.push("built for " + OCC_TXT[ans.occ]);
  let w = f.hook.charAt(0).toUpperCase() + f.hook.slice(1) + ".";
  if (bits.length) w += " It " + bits.slice(0,2).join(" and ") + ".";
  if (isAnchorMatch) w += " Shares clear DNA with your anchor fragrance.";
  return w;
}

function recommend(ans, anchor){
  const boost = anchor ? anchorBoost(anchor) : null;
  const anchorLC = (anchor||"").toLowerCase();
  const pool = DB.filter(f =>
    ans.budget.includes(f.tier) &&
    !(anchorLC && anchorLC.includes(f.name.toLowerCase().split(" ")[0]) && anchorLC.includes(f.brand.toLowerCase().split(" ")[0]))
  );
  const scored = pool.map(f => ({f, s: score(f, ans, boost)})).sort((a,b)=>b.s-a.s);
  const top5 = scored.slice(0,5);
  /* wildcard: best-scoring fragrance whose dominant scene differs from the user's */
  const domOf = f => Object.entries(f.scenes).sort((a,b)=>b[1]-a[1])[0][0];
  const wild = scored.slice(5).find(x => domOf(x.f) !== ans.scene) || scored[5] || null;
  return {top5, wild, boost};
}

function buildProfile(ans, anchor, boost){
  const base = PROFILES[ans.scene];
  let fams = base.families.map(([n,w])=>[n,w]);
  /* nudge weights by sweetness answer */
  if (ans.sweet === 2){ fams = fams.map(([n,w])=>[n, n==="Gourmand"||n==="Amber" ? w+5 : w]); }
  if (ans.sweet === 0){ fams = fams.map(([n,w])=>[n, n==="Gourmand" ? Math.max(w-8,4) : w]); }
  const total = fams.reduce((a,[,w])=>a+w,0);
  fams = fams.map(([n,w])=>[n, Math.round(w/total*100)]);
  let summary = base.line + " You want it " + PROJ_TXT[ans.proj] + ", tuned for " + OCC_TXT[ans.occ] + " in " + CLIMATE_TXT[ans.climate] + ".";
  if (anchor && boost) summary += " Your anchor — " + anchor.trim() + " — confirms the read: its DNA leans the same way.";
  else if (anchor) summary += " Anchored to " + anchor.trim() + ", weighed alongside your answers.";
  return { headline: base.headline, families: fams, pyramid: base.pyramid, summary };
}

/* ---------- memory: history saved in this browser (with in-memory fallback) ---------- */
const MEMKEY = "scentDeduction.v1";
let memFallback = { history: [] };
function loadMem(){
  try { return JSON.parse(localStorage.getItem(MEMKEY)) || { history: [] }; }
  catch(e){ return memFallback; }
}
function saveMem(m){
  try { localStorage.setItem(MEMKEY, JSON.stringify(m)); }
  catch(e){ memFallback = m; }
}
function pushHistory(entry){
  const m = loadMem();
  m.history.unshift(entry);
  m.history = m.history.slice(0, 12);
  saveMem(m);
}
function clearHistory(){ saveMem({ history: [] }); render(); }
function viewHistory(i){
  const h = loadMem().history[i];
  if (!h) return;
  state.result = h.result;
  state.stage = "results";
  render();
}

/* ---------- scent of the day: rotates daily, personalizes after first deduction ---------- */
function daySeed(){
  const d = new Date();
  return d.getFullYear()*372 + (d.getMonth()+1)*31 + d.getDate();
}
function scentOfTheDay(){
  const m = loadMem();
  const lastScene = m.history.length ? m.history[0].scene : null;
  const pool = lastScene ? DB.filter(f => (f.scenes[lastScene]||0) >= 2) : DB;
  const list = pool.length ? pool : DB;
  return { f: list[daySeed() % list.length], personalized: !!(lastScene && pool.length) };
}

function go(stage){ state.stage = stage; render(); }
function setAnchor(){ state.anchor = document.getElementById("anchorInput").value || ""; go("quiz"); }
function pick(i){
  const q = QUESTIONS[state.qIndex];
  state.answers[q.id] = q.options[i].v;
  if (state.qIndex + 1 < QUESTIONS.length){ state.qIndex++; render(); }
  else { go("loading"); }
}
function showResults(){
  const ans = state.answers;
  const {top5, wild, boost} = recommend(ans, state.anchor);
  state.result = {
    profile: buildProfile(ans, state.anchor, boost),
    recs: top5.map(x=>({f:x.f, why: whyText(x.f, ans, !!(boost && (x.f.scenes[boost.scene]||0) >= 2))})),
    wild
  };
  pushHistory({
    date: new Date().toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}),
    headline: state.result.profile.headline,
    scene: ans.scene,
    anchor: state.anchor.trim(),
    topRec: top5[0] ? top5[0].f.brand + " " + top5[0].f.name : "",
    result: state.result
  });
  go("results");
}
function newRun(){ state = { stage:"anchor", qIndex:0, answers:{}, anchor:"" }; render(); }
function restart(){ state = { stage:"intro", qIndex:0, answers:{}, anchor:"" }; render(); }

render();
</script>
